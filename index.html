<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Gimnasio">
<title>Mi Gimnasio · PPL ×2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#172033;--violet:#7357e8;--paper:#fffdf8;--line:#e4ded2;--muted:#7a8390;--green:#25845d;--red:#bd5555;--soft:#f1edff}
html{background:#e4e0d7}
body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#eef0f7,#ddd9d0 72%);min-height:100vh}
button,input,textarea{font:inherit} button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px #17203318}
.paper{background-color:var(--paper);background-image:linear-gradient(#1720330b 1px,transparent 1px);background-size:100% 28px}
.header{position:sticky;top:0;z-index:20;background:#fffdf8ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{padding:14px 16px}
.tabs{display:flex;gap:7px;overflow:auto;padding:8px 16px 12px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:900}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px #1720330d}
.num{height:44px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.num:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 3px #7357e81c}
.cta{width:100%;height:52px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:950}.secondary{height:43px;border:1px solid var(--line);background:#fff;border-radius:13px;font-weight:900;padding:0 12px}
.badge{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:950;color:var(--violet)}
.small{font-size:11px;color:var(--muted)}
.prevbox{background:#f5f2ec;border:1px solid #ddd7cb;border-radius:15px;padding:10px}
.bottom{position:sticky;bottom:0;z-index:25;background:#fffdf8f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.navbtn{border:0;background:transparent;border-radius:13px;padding:9px 4px;font-size:10px;font-weight:950;color:var(--muted)}.navbtn.active{background:var(--soft);color:var(--violet)}
.progress{height:8px;background:#e9e4d9;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .2s}
.modal{position:fixed;inset:0;z-index:60;background:#11182780;backdrop-filter:blur(5px);display:flex;align-items:flex-end}.sheet{width:100%;max-width:720px;margin:auto 0 0;background:var(--paper);border-radius:25px 25px 0 0;padding:20px;max-height:92vh;overflow:auto}
@media(min-width:721px){.modal{align-items:center}.sheet{border-radius:25px;max-width:600px}}
.hidden{display:none!important}.toast{position:fixed;left:16px;right:16px;bottom:90px;z-index:90;background:var(--ink);color:#fff;padding:13px 15px;border-radius:14px;text-align:center;font-weight:900;font-size:13px}
.danger{color:var(--red);border-color:#eccaca}.green{color:var(--green)}.red{color:var(--red)}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<div><div class="small" style="letter-spacing:.18em;text-transform:uppercase;font-weight:900">LIBRETA · PPL ×2</div><div style="font-size:25px;font-weight:950">Mi Gimnasio 🏋️</div></div>
<button id="moreBtn" class="pill">☰</button>
</div>
<div style="display:flex;gap:8px;margin-top:11px">
<input id="dateInput" type="date" class="num" style="text-align:left;padding:0 12px">
</div>
</div>
<div id="dayTabs" class="tabs"></div>
</header>

<main id="screen" class="wrap paper"></main>

<nav class="bottom">
<button class="navbtn active" data-page="training">🏋️<br>Entrenamiento</button>
<button class="navbtn" data-page="history">📚<br>Historial</button>
<button class="navbtn" data-page="plan">⚙️<br>Modificar plan</button>
</nav>
</div>

<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const DEFAULT_PLAN = [
{id:1,n:"Push A",s:"Pecho · tríceps · hombro",e:[
["Press plano mancuernas",3,"6–10","2→1"],["Press superior multipower",3,"8–12","2→1"],["Fondos pecho",3,"8–12","2→1"],["Extensión tríceps",3,"10–15","1–2"],["Press tríceps multipower",2,"8–12","1–2"],["Elevaciones laterales polea",3,"12–20","1–2"],["Elevaciones laterales banco",3,"12–20","1–2"]]},
{id:2,n:"Pull A",s:"Espalda · bíceps",e:[
["Dominadas libres",3,"6–10","2→1"],["Remo máquina unilateral",3,"8–12","1–2"],["Face pull polea",3,"12–20","1–2"],["Curl barra Z banco",3,"8–12","1–2"],["Martillo cuerda",3,"10–15","1–2"],["Lumbares lastre",3,"10–15","1–2"]]},
{id:3,n:"Legs A",s:"Piernas",e:[
["Hack squat",3,"6–10","2→1"],["Peso muerto rumano máquina",3,"8–12","2→1"],["Extensiones (3 puntos)",3,"10–15","1–2"],["Abductor máquina",3,"12–20","1–2"],["Femoral sentado",3,"8–12","1–2"],["Gemelo parado",3,"8–15","1–2"]]},
{id:4,n:"Push B",s:"Pecho · tríceps · hombro",e:[
["Press plano multipower",3,"6–10","2→1"],["Press superior máquina",3,"8–12","2→1"],["Fondos tríceps",2,"8–12","1–2"],["Contractora",2,"10–15","1–2"],["Extensión tríceps cuerda una mano",3,"10–15","1–2"],["Elevaciones laterales poleas cruzadas",3,"12–20","1–2"],["Elevaciones laterales parado",3,"12–20","1–2"]]},
{id:5,n:"Pull B",s:"Espalda · bíceps",e:[
["Dominadas lastradas",3,"6–10","2→1"],["Remo Gironda",3,"8–12","1–2"],["Face pull polea unilateral",3,"12–20","1–2"],["Curl barra Z banco",3,"8–12","1–2"],["Martillo cuerda",3,"10–15","1–2"],["Lumbares libres",3,"10–15","1–2"]]},
{id:6,n:"Legs B",s:"Piernas",e:[
["Sentadillas",3,"6–10","2→1"],["Peso muerto rumano barra",3,"6–10","2→1"],["Extensiones (3 puntos)",3,"10–15","1–2"],["Abductor máquina",3,"12–20","1–2"],["Femoral sentado",3,"8–12","1–2"],["Gemelo parado",3,"8–15","1–2"]]}
];

const STORAGE_KEY = "mi_gimnasio_v5";
let db = loadDB();
let day = 1;
let date = today();
let page = "training";
let timerInterval = null;
let toastTimer = null;

function today(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function esc(x){
  return String(x ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function idFor(name){ return String(name).trim().toLowerCase().replace(/\s+/g,"_").replace(/[^\wáéíóúüñ-]/g,"_"); }
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const x = JSON.parse(raw);
      if(x && Array.isArray(x.plan) && x.sessions) return x;
    }
  }catch(e){}
  return {plan:clone(DEFAULT_PLAN),sessions:{}};
}
function sessionKey(d=day,dt=date){ return dt+"__"+d; }
function getSession(create=false){
  const k=sessionKey();
  if(!db.sessions[k] && create){
    db.sessions[k]={date,day,status:"open",startedAt:new Date().toISOString(),ex:{}};
    saveDB();
  }
  return db.sessions[k] || null;
}
function ensureExerciseData(ex,s){
  const key=idFor(ex[0]);
  let d=s?.ex?.[key];
  if(!d) d={sets:[],comment:""};
  if(!Array.isArray(d.sets)) d.sets=[];
  while(d.sets.length<ex[1]) d.sets.push({weight:"",reps:"",rir:""});
  if(d.sets.length>ex[1]) d.sets=d.sets.slice(0,ex[1]);
  return d;
}
function lastPreviousSession(exName){
  return Object.values(db.sessions)
    .filter(s=>s.day===day && s.date<date && s.ex?.[idFor(exName)])
    .sort((a,b)=>b.date.localeCompare(a.date))[0] || null;
}
function sessionVolume(s){
  if(!s) return 0;
  const plan=db.plan.find(x=>x.id===s.day);
  if(!plan) return 0;
  let total=0;
  plan.e.forEach(ex=>{
    const d=s.ex?.[idFor(ex[0])];
    (d?.sets||[]).forEach(set=>{
      total+=(Number(set.weight)||0)*(Number(set.reps)||0);
    });
  });
  return total;
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add("hidden"),2200);
}
function openModal(html){ document.getElementById("sheet").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }
function closeModal(){ document.getElementById("modal").classList.add("hidden"); }
function confirmDialog(title,yesText,noText){
  return new Promise(resolve=>{
    openModal(`<div class="badge">CONFIRMACIÓN</div><h2 style="font-size:23px;margin:7px 0 12px">${title}</h2>
    <div style="display:grid;gap:9px;margin-top:16px">
      <button id="confirmYes" class="cta">${yesText}</button>
      <button id="confirmNo" class="secondary">${noText}</button>
    </div>`);
    document.getElementById("confirmYes").onclick=()=>{closeModal();resolve(true)};
    document.getElementById("confirmNo").onclick=()=>{closeModal();resolve(false)};
  });
}
function render(){
  renderDayTabs();
  document.getElementById("dateInput").value=date;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="training") renderTraining();
  if(page==="history") renderHistory();
  if(page==="plan") renderPlan();
}
function renderDayTabs(){
  document.getElementById("dayTabs").innerHTML=db.plan.map(d=>
    `<button class="pill ${d.id===day?"active":""}" data-day="${d.id}">D${d.id} · ${esc(d.n)}</button>`).join("");
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    day=Number(b.dataset.day); page="training"; render();
  });
}
function startTraining(){
  const existing=getSession();
  if(existing){
    if(existing.status==="finished"){
      resumeSession();
    }else{
      toast("🔥 Ya tienes una sesión abierta. ¡Seguimos!");
      render();
    }
    return;
  }
  getSession(true);
  toast("🔥 ¡A darle! Entrenamiento iniciado.");
  render();
}
function resumeSession(){
  const s=getSession();
  if(!s) return;
  s.status="open";
  s.resumedAt=new Date().toISOString();
  saveDB();
  closeModal();
  toast("🔄 Sesión recuperada. ¡Seguimos!");
  render();
}
async function finishTraining(){
  const s=getSession();
  if(!s) return;
  const ok=await confirmDialog("¿Has terminado de verdad? 💪","Sí, he terminado","Seguir entrenando");
  if(!ok) return;
  s.status="finished"; s.finishedAt=new Date().toISOString(); saveDB();
  toast("🏆 Sesión guardada. ¡Buen trabajo!");
  render();
}
function maybeResumePrompt(){
  const open=Object.values(db.sessions).find(s=>s.status==="open");
  if(!open || page!=="training") return;
  if(open.day!==day || open.date!==date){
    openModal(`<div class="badge">ENTRENAMIENTO PENDIENTE</div><h2 style="font-size:23px;margin:7px 0 10px">Tienes una sesión esperando 💪</h2>
      <p class="small">Día ${open.day} · ${esc(db.plan.find(x=>x.id===open.day)?.n||"Entrenamiento")} · ${open.date}</p>
      <div style="display:grid;gap:9px;margin-top:16px">
      <button id="resumeOpen" class="cta">🔄 Volver al entrenamiento</button>
      <button id="leaveOpen" class="secondary">Ahora no</button></div>`);
    document.getElementById("resumeOpen").onclick=()=>{
      day=open.day; date=open.date; page="training"; resumeSession();
    };
    document.getElementById("leaveOpen").onclick=closeModal;
  }
}
function renderTraining(){
  const plan=db.plan.find(x=>x.id===day) || db.plan[0];
  const s=getSession();
  let html=`<section class="card" style="padding:17px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;gap:10px">
      <div><div class="badge">DÍA ${day} · ${esc(plan.n)}</div><h1 style="font-size:24px;margin:5px 0">${esc(plan.s)}</h1>
      <div class="small">${s?.status==="open"?"🔥 Entrenamiento en curso":s?.status==="finished"?"🏁 Sesión finalizada":"Cuando estés listo, empezamos."}</div></div>
      <div style="font-size:28px">💥</div>
    </div>
    <div class="progress" style="margin-top:13px"><i id="progressBar" style="width:0%"></i></div>
    <div id="summary" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div>
    ${!s?'<button id="startBtn" class="cta" style="margin-top:13px">▶️ VAMOS A ENTRENAR</button>':''}
    ${s?.status==="finished"?'<button id="resumeBtn" class="secondary" style="width:100%;margin-top:10px">🔄 Volver a esta sesión</button>':''}
    ${s?.status==="open"?'<button id="finishBtn" class="cta" style="margin-top:13px">🏁 HE TERMINADO LA SESIÓN</button>':''}
  </section>`;
  if(!s){
    html+=`<div class="card" style="padding:28px 18px;text-align:center"><div style="font-size:36px">📓</div>
      <b>Tu libreta está lista.</b><div class="small" style="margin-top:6px">Pulsa «Vamos a entrenar» para crear la sesión. Abrir la app no crea sesiones nuevas.</div></div>`;
  }else{
    html+=plan.e.map((ex,i)=>renderExercise(ex,i,s)).join("");
  }
  document.getElementById("screen").innerHTML=html;
  document.getElementById("startBtn")?.addEventListener("click",startTraining);
  document.getElementById("resumeBtn")?.addEventListener("click",resumeSession);
  document.getElementById("finishBtn")?.addEventListener("click",finishTraining);
  if(s){ bindInputs(s); updateSummary(s); }
}
function renderExercise(ex,index,s){
  const d=ensureExerciseData(ex,s);
  const prev=lastPreviousSession(ex[0]);
  const previousHTML=prev
    ? `<div class="prevbox"><div class="small" style="font-weight:950">ANTERIOR · ${prev.date}</div>
      <div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:5px;margin-top:7px;font-size:11px">
      ${prev.ex[idFor(ex[0])].sets.map((x,j)=>`<b>S${j+1}</b><span>${esc(x.weight||"—")} kg</span><span>${esc(x.reps||"—")} reps</span><span>RIR ${esc(x.rir||"—")}</span>`).join("")}</div></div>`
    : `<div class="prevbox small">Primera sesión de este ejercicio. 💥</div>`;
  return `<article class="card" style="padding:15px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;gap:8px">
      <div><div class="badge">EJERCICIO ${index+1}</div><h2 style="font-size:17px;margin:4px 0">${esc(ex[0])}</h2>
      <div class="small">${ex[1]} series · ${esc(ex[2])} reps · RIR ${esc(ex[3])}</div></div>
      <button class="secondary restBtn" style="width:46px;padding:0">⏱️</button>
    </div>
    ${previousHTML}
    <div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:7px;margin-top:10px">
      <div></div><b class="small" style="text-align:center">KG</b><b class="small" style="text-align:center">REPS</b><b class="small" style="text-align:center">RIR</b>
      ${d.sets.map((x,j)=>`
        <b style="align-self:center;text-align:center">S${j+1}</b>
        <input class="num dataInput" type="number" inputmode="decimal" step=".5" value="${esc(x.weight)}" placeholder="kg" data-ex="${esc(ex[0])}" data-set="${j}" data-field="weight">
        <input class="num dataInput" type="number" inputmode="numeric" min="0" value="${esc(x.reps)}" placeholder="${esc(ex[2])}" data-ex="${esc(ex[0])}" data-set="${j}" data-field="reps">
        <input class="num dataInput" type="number" inputmode="numeric" min="0" max="10" value="${esc(x.rir)}" placeholder="RIR" data-ex="${esc(ex[0])}" data-set="${j}" data-field="rir">
      `).join("")}
    </div>
    <textarea class="commentInput" data-ex="${esc(ex[0])}" placeholder="Sensaciones / técnica / notas…" style="width:100%;height:46px;margin-top:9px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:12px;resize:vertical">${esc(d.comment)}</textarea>
  </article>`;
}
function bindInputs(s){
  document.querySelectorAll(".dataInput").forEach(input=>{
    input.addEventListener("input",()=>{
      const plan=db.plan.find(x=>x.id===day);
      const ex=plan.e.find(x=>x[0]===input.dataset.ex);
      const d=ensureExerciseData(ex,s);
      d.sets[Number(input.dataset.set)][input.dataset.field]=input.value;
      s.ex[idFor(ex[0])]=d;
      saveDB(); updateSummary(s);
    });
  });
  document.querySelectorAll(".commentInput").forEach(input=>{
    input.addEventListener("input",()=>{
      const plan=db.plan.find(x=>x.id===day);
      const ex=plan.e.find(x=>x[0]===input.dataset.ex);
      const d=ensureExerciseData(ex,s); d.comment=input.value; s.ex[idFor(ex[0])]=d; saveDB();
    });
  });
  document.querySelectorAll(".restBtn").forEach(b=>b.addEventListener("click",openTimer));
}
function updateSummary(s){
  const plan=db.plan.find(x=>x.id===day);
  const done=plan.e.filter(ex=>{
    const d=s.ex?.[idFor(ex[0])];
    return d?.sets?.every(x=>x.weight!=="" && x.reps!=="");
  }).length;
  const prev=Object.values(db.sessions).filter(x=>x.day===day&&x.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  const vol=sessionVolume(s), old=prev?sessionVolume(prev):0;
  const change=old?((vol-old)/old*100):null;
  document.getElementById("progressBar").style.width=(done/Math.max(plan.e.length,1)*100)+"%";
  document.getElementById("summary").innerHTML=`
    <div class="prevbox"><div class="small">EJERCICIOS</div><b>${done}/${plan.e.length}</b></div>
    <div class="prevbox"><div class="small">VOLUMEN</div><b>${vol.toLocaleString("es-ES",{maximumFractionDigits:0})} kg ${change===null?"":`<span class="${change>=0?"green":"red"}">${change>=0?"+":""}${change.toFixed(1)}%</span>`}</b></div>`;
}
function renderHistory(){
  const sessions=Object.values(db.sessions).sort((a,b)=>b.date.localeCompare(a.date)||b.day-a.day);
  document.getElementById("screen").innerHTML=`<section class="card" style="padding:17px">
    <div class="badge">HISTORIAL</div><h1 style="font-size:25px;margin:5px 0">Tus batallas 🏆</h1>
    <div class="small">Puedes abrir o borrar cualquier sesión. Borrar requiere dos confirmaciones.</div></section>
    <div style="margin-top:12px">${sessions.length?sessions.map(s=>{
      const p=db.plan.find(x=>x.id===s.day);
      return `<article class="card" style="padding:14px;margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <div><b>Día ${s.day} · ${esc(p?.n||"Sesión")}</b><div class="small">${s.date} · ${s.status==="finished"?"Finalizada":"En curso"} · ${sessionVolume(s).toLocaleString("es-ES")} kg</div></div>
          <div style="display:flex;gap:6px"><button class="secondary openHistory" data-key="${esc(sessionKey(s.day,s.date))}">↗</button><button class="secondary danger deleteHistory" data-key="${esc(sessionKey(s.day,s.date))}">🗑️</button></div>
        </div></article>`;
    }).join(""):`<div class="card" style="padding:30px;text-align:center"><div style="font-size:35px">📓</div><b>Aún no hay entrenamientos.</b></div>`}</div>`;
  document.querySelectorAll(".openHistory").forEach(b=>b.onclick=()=>{
    const s=db.sessions[b.dataset.key]; if(!s)return;
    date=s.date; day=s.day; page="training"; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
  document.querySelectorAll(".deleteHistory").forEach(b=>b.onclick=()=>deleteHistory(b.dataset.key));
}
async function deleteHistory(key){
  const s=db.sessions[key]; if(!s)return;
  const ok=await confirmDialog("¿Borrar esta sesión? 🗑️","Sí, borrar","Cancelar");
  if(!ok)return;
  const ok2=await confirmDialog(`Última oportunidad: ¿borrar ${s.date} definitivamente?`,"BORRAR DEFINITIVAMENTE","No, conservar");
  if(!ok2)return;
  delete db.sessions[key]; saveDB(); toast("Sesión eliminada."); renderHistory();
}
function renderPlan(){
  document.getElementById("screen").innerHTML=`<section class="card" style="padding:17px">
    <div class="badge">MODIFICAR PLAN</div><h1 style="font-size:25px;margin:5px 0">Construye tu rutina ⚙️</h1>
    <div class="small">Cambia ejercicios, series, rango de repeticiones y RIR. Los cambios afectan a futuras sesiones y no borran el historial.</div></section>
    <div style="margin-top:12px">${db.plan.map(d=>`<section class="card" style="padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><b>Día ${d.id} · ${esc(d.n)}</b><div class="small">${d.e.length} ejercicios</div></div><button class="secondary editDay" data-id="${d.id}">Editar</button></section>`).join("")}</div>
    <button id="resetPlan" class="secondary" style="width:100%;margin-top:2px">↺ Restaurar plan original</button>`;
  document.querySelectorAll(".editDay").forEach(b=>b.onclick=()=>editDay(Number(b.dataset.id)));
  document.getElementById("resetPlan").onclick=async()=>{
    const ok=await confirmDialog("¿Restaurar el plan original? Tus sesiones no se borrarán.","Sí, restaurar","Cancelar");
    if(ok){db.plan=clone(DEFAULT_PLAN);saveDB();toast("Plan restaurado ✓");render();}
  };
}
function editDay(id){
  const d=db.plan.find(x=>x.id===id);
  const rows=d.e.map((e,i)=>`<div class="card editRow" style="padding:10px;margin-bottom:8px" data-index="${i}">
    <input class="num eName" value="${esc(e[0])}" style="text-align:left;padding:0 10px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px">
      <input class="num eRange" value="${esc(e[2])}" placeholder="Reps">
      <input class="num eSets" type="number" min="1" value="${e[1]}" placeholder="Series">
      <input class="num eRir" value="${esc(e[3])}" placeholder="RIR">
    </div>
    <button class="secondary danger removeEx" style="width:100%;margin-top:7px">🗑️ Quitar ejercicio</button>
  </div>`).join("");
  openModal(`<div class="badge">EDITAR DÍA ${id}</div><h2 style="font-size:23px;margin:5px 0">${esc(d.n)}</h2>
    <div class="small">Añade o quita ejercicios y cambia sus parámetros.</div>
    <div id="editList" style="margin-top:12px">${rows}</div>
    <button id="addExercise" class="secondary" style="width:100%">＋ Añadir ejercicio</button>
    <button id="saveDay" class="cta" style="margin-top:9px">Guardar cambios</button>
    <button id="cancelEdit" class="secondary" style="width:100%;margin-top:7px">Cancelar</button>`);
  document.getElementById("addExercise").onclick=()=>{
    d.e.push(["Nuevo ejercicio",3,"8–12","1–2"]);
    editDay(id);
  };
  document.querySelectorAll(".removeEx").forEach((btn,index)=>btn.onclick=async()=>{
    if(d.e.length<=1){toast("Debe quedar al menos un ejercicio.");return;}
    const ok=await confirmDialog("¿Quitar este ejercicio del plan?","Sí, quitar","Cancelar");
    if(ok){d.e.splice(index,1);editDay(id);}
  });
  document.getElementById("saveDay").onclick=()=>{
    const rows=[...document.querySelectorAll(".editRow")];
    d.e=rows.map(row=>[
      row.querySelector(".eName").value.trim()||"Ejercicio",
      Math.max(1,Number(row.querySelector(".eSets").value)||1),
      row.querySelector(".eRange").value.trim()||"8–12",
      row.querySelector(".eRir").value.trim()||"1–2"
    ]);
    saveDB(); closeModal(); toast("Plan actualizado ✓"); render();
  };
  document.getElementById("cancelEdit").onclick=closeModal;
}
function openTimer(){
  let seconds=90;
  openModal(`<div class="badge">DESCANSO</div><div id="timerClock" style="font-size:64px;text-align:center;font-weight:950;font-variant-numeric:tabular-nums;margin:10px 0">01:30</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
      <button class="secondary timerPreset" data-sec="60">60 s</button><button class="secondary timerPreset" data-sec="90">90 s</button><button class="secondary timerPreset" data-sec="120">120 s</button>
    </div><button id="startTimer" class="cta" style="margin-top:9px">▶ Empezar</button><button id="closeTimer" class="secondary" style="width:100%;margin-top:7px">Cerrar</button>`);
  const clock=document.getElementById("timerClock");
  const show=()=>clock.textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  document.querySelectorAll(".timerPreset").forEach(b=>b.onclick=()=>{seconds=Number(b.dataset.sec);clearInterval(timerInterval);show();});
  document.getElementById("startTimer").onclick=()=>{
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
      seconds--; show();
      if(seconds<=0){clearInterval(timerInterval);navigator.vibrate?.([250,100,250]);toast("⏰ ¡A por la siguiente serie!");}
    },1000);
  };
  document.getElementById("closeTimer").onclick=()=>{clearInterval(timerInterval);closeModal();};
  show();
}
document.getElementById("dateInput").addEventListener("change",e=>{date=e.target.value||today();render();});
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;render();}));
document.getElementById("moreBtn").addEventListener("click",()=>{
  openModal(`<div class="badge">OPCIONES</div><h2 style="font-size:24px;margin:5px 0">Herramientas</h2>
    <button id="exportBtn" class="secondary" style="width:100%;margin-top:10px">↓ Exportar copia de seguridad</button>
    <label class="secondary" style="display:block;text-align:center;padding-top:12px;margin-top:8px">↑ Importar copia de seguridad<input id="importFile" type="file" accept=".json,application/json" style="display:none"></label>
    <button id="closeOptions" class="secondary" style="width:100%;margin-top:8px">Cerrar</button>`);
  document.getElementById("closeOptions").onclick=closeModal;
  document.getElementById("exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="mi-gimnasio-backup.json"; a.click(); URL.revokeObjectURL(url);
    toast("Copia exportada ✓");
  };
  document.getElementById("importFile").onchange=e=>{
    const file=e.target.files?.[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=JSON.parse(reader.result);
        if(!imported || !Array.isArray(imported.plan) || !imported.sessions) throw new Error();
        db=imported; saveDB(); closeModal(); render(); toast("Copia importada ✓");
      }catch(err){alert("El archivo de copia no es válido.");}
    };
    reader.readAsText(file);
  };
});
window.addEventListener("pageshow",()=>setTimeout(maybeResumePrompt,150));
window.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") setTimeout(maybeResumePrompt,250);
});
render();
</script>

if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
